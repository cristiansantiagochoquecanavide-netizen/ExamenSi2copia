services:
  db:
    image: postgres:16-alpine
    container_name: fashionstore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fashionstore_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fashionstore_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fashionstore_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-fashionstore_db}
      DB_HOST: db
      DB_PORT: 5432
      PROJECT_NAME: "FashionStore API"
      ENVIRONMENT: development
      DEBUG: "True"
      API_V1_STR: /api/v1
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/init_db.py:/app/init_db.py
      - ./backend/seed.py:/app/seed.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fashionstore_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - NODE_ENV=development

volumes:
  postgres_data:
    name: fashionstore_postgres_data
    driver: local
