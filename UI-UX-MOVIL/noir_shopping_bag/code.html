  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-16 px-layout-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><button class="w-11 h-11 flex items-center justify-center text-on-surface" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><img alt="NOIR Logo" class="h-6 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8bZaXHkmjIU0vA8a8fgdWfimkDdaGNMLYBkD_ACM-ToktbOw-KtKt5BQYZv72oh6KLQogKrFU7ZK8KI0q5Xeiu2GNQsj9K0rTD2FHGbVqVSV_6qJ4uFikXkN7TTTNkPNfdtkDiUOh7vSywfD5kU-8Aj0bB647vlxxOvbKWreHHa2xt2eRSUax3YcMmxKpa56_pkjxMCbj4VHZBrl7fMENetMBeCnQUGLBeYirFPE1S2gxEqIUh-sI"/></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full px-layout-margin-mobile pt-16 bg-surface flex-grow"><div class="flex flex-col w-full pb-24 text-on-surface">
<div class="flex flex-col mb-space-lg">
<span class="font-label-caps text-on-surface-variant uppercase tracking-widest text-[11px] mb-space-2xs">Review Your Selection</span>
<h1 class="font-headline-lg-mobile text-headline-lg font-light text-on-surface">Shopping Bag</h1>
</div>
<!-- Cart Items List -->
<div class="flex flex-col gap-space-md mb-space-lg">
<div class="bg-surface-container-low p-space-sm flex gap-space-md relative overflow-hidden group">
<div class="w-24 h-32 flex-shrink-0 bg-surface-container relative">
<img class="w-full h-full object-cover" data-alt="High fashion editorial photography of a Structured Cashmere Trench Coat in deep obsidian black, worn by a model in a minimalist concrete studio with dramatic soft side lighting, highlighting the luxurious texture and sharp tailoring." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjSkyciLMG2EcKDFwgWUrxvUNXbu41ybcx5viQnZ0D9F_AvdRPeVHJ8ka8lV_MahjTOoOalSw1CpmAZnY2BmKJPYUF45AHh6cJCal67uHCcXxbJGlZFVLjriAbNpQUdSbglL4aObJcu6_q0zO2eC7y1_LHnjt0qlWefK3YHwAS3f2XPIMDlLGHYr4JoFn0DRKdHUMKJ6ScsVdb0fiHhUe0hG_d0W3Dj2_U7MCwDlnVs7kdCXed0zYI"/>
</div>
<div class="flex flex-col justify-between flex-grow py-1 min-w-0">
<div class="flex justify-between items-start gap-space-xs">
<div>
<h2 class="font-headline-sm text-on-surface truncate">Structured Cashmere Trench Coat</h2>
<p class="font-body-sm text-on-surface-variant mt-0.5">Size: M • Color: Obsidian</p>
</div>
<button class="text-on-surface-variant hover:text-on-surface p-1" onclick="this.closest('.group').remove(); updateTotals();">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<div class="flex justify-between items-end">
<div class="flex items-center border border-outline-variant/40 bg-surface">
<button class="w-7 h-7 flex items-center justify-center text-on-surface-variant hover:text-on-surface" onclick="decrementQty(this)">-</button>
<span class="w-8 text-center font-body-sm text-on-surface item-qty">1</span>
<button class="w-7 h-7 flex items-center justify-center text-on-surface-variant hover:text-on-surface" onclick="incrementQty(this)">+</button>
</div>
<span class="font-body-lg font-light text-on-surface item-price" data-price="1450">$1,450</span>
</div>
</div>
</div>
</div>
<!-- Promo Code Input -->
<div class="mb-space-lg">
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low border-b border-outline py-3 px-0 text-on-surface font-body-sm tracking-wider focus:outline-none focus:border-on-surface transition-colors uppercase placeholder:text-outline" placeholder="PROMOTION CODE" type="text"/>
<button class="absolute right-0 font-label-caps text-on-surface text-[11px] uppercase tracking-widest px-2 py-1">Apply</button>
</div>
</div>
<!-- Order Breakdown -->
<div class="bg-surface-container-low p-space-md flex flex-col gap-space-sm mb-space-lg">
<div class="flex justify-between items-center font-body-sm text-on-surface-variant">
<span>Subtotal</span>
<span class="text-on-surface" id="subtotal-display">$1,450</span>
</div>
<div class="flex justify-between items-center font-body-sm text-on-surface-variant">
<span>Express Shipping</span>
<span class="text-secondary">Complimentary</span>
</div>
<div class="flex justify-between items-center font-body-sm text-on-surface-variant">
<span>Estimated Tax</span>
<span class="text-on-surface">$0</span>
</div>
<div class="w-full h-[1px] bg-outline-variant/30 my-space-2xs"></div>
<div class="flex justify-between items-center">
<span class="font-headline-sm text-on-surface">Total</span>
<span class="font-headline-md text-on-surface" id="total-display">$1,450</span>
</div>
</div>
<!-- Quick Pay Options -->
<div class="flex flex-col gap-space-xs mb-space-md">
<span class="font-label-caps text-on-surface-variant uppercase tracking-widest text-[11px] mb-space-2xs">Express Checkout</span>
<button class="w-full h-12 bg-white text-black font-medium flex items-center justify-center gap-2 hover:bg-secondary transition-colors" onclick="triggerQuickPay('Apple Pay')">
<span class="material-symbols-outlined text-[20px]">phone_iphone</span>
<span class="font-body-md font-medium tracking-wide">Pay with Apple Pay</span>
</button>
<button class="w-full h-12 bg-surface-container-high text-on-surface flex items-center justify-center gap-2 hover:bg-surface-bright transition-colors" onclick="triggerQuickPay('Credit Card')">
<span class="material-symbols-outlined text-[20px]">credit_card</span>
<span class="font-body-md font-medium tracking-wide">Quick Credit Card</span>
</button>
</div>
<!-- Primary Secure Checkout CTA -->
<div class="flex flex-col">
<button class="w-full h-14 bg-secondary text-on-secondary font-medium tracking-widest uppercase text-label-caps flex items-center justify-center gap-2 hover:brightness-110 transition-all shadow-lg shadow-secondary/10" onclick="proceedToCheckout()">
<span>Proceed to Secure Checkout</span>
<span class="material-symbols-outlined text-[18px]">lock</span>
</button>
<div class="flex items-center justify-center gap-space-xs mt-space-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[14px]">verified_user</span>
<span class="font-body-sm text-[11px] tracking-wider uppercase">End-to-End Encrypted • 30-Day Returns</span>
</div>
</div>
<!-- Delight Notification Toast (Hidden by Default) -->
<div class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-surface-container-highest text-on-surface px-space-md py-space-xs shadow-2xl flex items-center gap-space-xs opacity-0 pointer-events-none transition-all duration-300 z-50" id="toast">
<span class="material-symbols-outlined text-secondary text-[18px]">check_circle</span>
<span class="font-body-sm tracking-wide" id="toast-message">Action completed</span>
</div>
</div>
<script>
  function incrementQty(btn) {
    const qtySpan = btn.parentElement.querySelector('.item-qty');
    let qty = parseInt(qtySpan.innerText);
    qtySpan.innerText = ++qty;
    updateTotals();
  }

  function decrementQty(btn) {
    const qtySpan = btn.parentElement.querySelector('.item-qty');
    let qty = parseInt(qtySpan.innerText);
    if (qty > 1) {
      qtySpan.innerText = --qty;
      updateTotals();
    }
  }

  function updateTotals() {
    const qtyElement = document.querySelector('.item-qty');
    const qty = qtyElement ? parseInt(qtyElement.innerText) : 0;
    const basePrice = 1450;
    const total = qty * basePrice;
    
    const subtotalEl = document.getElementById('subtotal-display');
    const totalEl = document.getElementById('total-display');
    
    if (subtotalEl && totalEl) {
      subtotalEl.innerText = '$' + total.toLocaleString();
      totalEl.innerText = '$' + total.toLocaleString();
    }
  }

  function triggerQuickPay(method) {
    showToast('Initializing ' + method + ' secure tunnel...');
  }

  function proceedToCheckout() {
    showToast('Redirecting to secure environment...');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    const msgEl = document.getElementById('toast-message');
    msgEl.innerText = msg;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');
    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0', 'pointer-events-none');
    }, 2500);
  }
</script></main></body></html>
