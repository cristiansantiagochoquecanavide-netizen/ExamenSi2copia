services:
  # ====================================================================
  # 1. FashionStore Backend API (FastAPI + Python 3.12 + Docker)
  # ====================================================================
  - type: web
    name: fashionstore-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fashionstore-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: STRIPE_CURRENCY
        value: bob
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

  # ====================================================================
  # 2. FashionStore Frontend (Angular 19 PWA - Static Site CDN)
  # ====================================================================
  - type: web
    name: fashionstore-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist/fashionstore-frontend/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ======================================================================
# 3. PostgreSQL Database (Render Managed PostgreSQL)
# ======================================================================
databases:
  - name: fashionstore-db
    plan: free
    region: oregon
