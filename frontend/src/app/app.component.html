<div class="app-layout">
  <header class="navbar">
    <div class="brand-zone">
      <a routerLink="/catalogo" class="logo-link">
        <span class="logo-serif">FASHIONSTORE</span>
        <span class="logo-badge">ATELIER NOIR</span>
      </a>
    </div>

    <nav class="nav-links">
      <a routerLink="/catalogo" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Catálogo &amp; AR</a>
      <a routerLink="/catalogo/parametros" routerLinkActive="active">Parámetros Moda</a>
      <a routerLink="/inventario" routerLinkActive="active">Sucursales</a>
      <a routerLink="/usuarios/gestion" routerLinkActive="active">Personal &amp; Clientes</a>
      <a routerLink="/usuarios/roles" routerLinkActive="active">Roles / RBAC</a>
      <a routerLink="/usuarios/auditoria" routerLinkActive="active">Auditoría</a>
    </nav>

    <div class="user-auth-zone">
      @if (authService.isAuthenticated()) {
        <div class="user-profile-box">
          <span class="user-role-badge">{{ authService.currentUser()?.rol?.nombre || 'AUTENTICADO' }}</span>
          <span class="user-name">{{ authService.currentUser()?.nombre }}</span>
          <button type="button" class="btn-logout" (click)="logout()">Salir</button>
        </div>
      } @else {
        <a routerLink="/login" class="btn-login-nav">
          <span class="login-dot">&bull;</span> Iniciar Sesión
        </a>
      }
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
