<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%" fill="none">
  <!-- Símbolo / Isotipo: Aguja de atelier y facetas de diamante arquitectónico -->
  <g transform="translate(140, 130)">
    <!-- Diamante arquitectónico facetado con líneas finas de alta precisión -->
    <polygon points="0,-85 62,0 0,85 -62,0" stroke="#0A0A0A" stroke-width="1.75" fill="none" stroke-linejoin="round"/>
    <polygon points="0,-60 44,0 0,60 -44,0" stroke="#0A0A0A" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
    <line x1="-62" y1="0" x2="62" y2="0" stroke="#0A0A0A" stroke-width="1.2" stroke-opacity="0.8"/>
    <line x1="-32" y1="-44" x2="32" y2="44" stroke="#0A0A0A" stroke-width="0.75" stroke-opacity="0.4"/>
    <line x1="32" y1="-44" x2="-32" y2="44" stroke="#0A0A0A" stroke-width="0.75" stroke-opacity="0.4"/>
    
    <!-- Aguja vertical de atelier -->
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Ojo de la aguja -->
    <ellipse cx="0" cy="-70" rx="2" ry="7" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5"/>
    
    <!-- Puntos de anclaje de precisión milimétrica / AR atelier -->
    <circle cx="0" cy="0" r="3" fill="#0A0A0A"/>
    <circle cx="0" cy="-85" r="1.5" fill="#0A0A0A"/>
    <circle cx="0" cy="85" r="1.5" fill="#0A0A0A"/>
    <circle cx="-62" cy="0" r="1.5" fill="#0A0A0A"/>
    <circle cx="62" cy="0" r="1.5" fill="#0A0A0A"/>
  </g>

  <!-- Tipografía / Wordmark: FASHIONSTORE -->
  <g transform="translate(260, 130)">
    <text x="0" y="8" font-family="'Didot', 'Playfair Display', 'Bodoni MT', 'Cinzel', serif" font-size="34" font-weight="600" letter-spacing="0.36em" fill="#0A0A0A">FASHIONSTORE</text>
    <text x="3" y="34" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="400" letter-spacing="0.48em" fill="#737373">HAUTE COUTURE &amp; AR ATELIER</text>
    <line x1="3" y1="46" x2="280" y2="46" stroke="#0A0A0A" stroke-width="0.75" stroke-opacity="0.3"/>
  </g>
</svg>